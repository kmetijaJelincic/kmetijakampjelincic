<!DOCTYPE html>
<html lang="sl">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <meta name="robots" content="noindex" />
    <title>Stran ne obstaja — Kmetija Kamp Jelinčič</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <style>
        :root {
            --brand: #168063;
            --brand-hover: #12664f;
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            height: 100%;
            margin: 0;
        }

        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 2rem 1.25rem;
            text-align: center;
            color: #212529;
            background: #f8f9fa;
            font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        img {
            width: 96px;
            height: auto;
            margin-bottom: 1.5rem;
        }

        .code {
            font-size: 4rem;
            font-weight: 900;
            letter-spacing: -0.03em;
            line-height: 1;
            color: var(--brand);
            margin: 0;
        }

        h1 {
            font-size: 1.5rem;
            font-weight: 800;
            margin: 0.75rem 0 0.25rem;
        }

        .sub {
            font-size: 1rem;
            color: #5a6268;
            margin: 0 0 1.75rem;
            max-width: 32rem;
        }

        .btn {
            display: inline-block;
            padding: 0.75rem 1.75rem;
            border-radius: 0.5rem;
            background: var(--brand);
            color: #fff;
            font-weight: 700;
            text-decoration: none;
            transition: background 0.2s ease;
        }

        .btn:hover,
        .btn:focus {
            background: var(--brand-hover);
        }

        .en {
            margin-top: 1.5rem;
            font-size: 0.9rem;
            color: #6c757d;
        }
    </style>
</head>

<body>
    <img src="/assets/img/logo-transparent.webp" alt="Kmetija Kamp Jelinčič" />
    <p class="code">404</p>
    <h1>Te strani ni mogoče najti</h1>
    <p class="sub">Povezava je morda napačna ali pa stran ne obstaja več. Vrnite se na domačo stran.</p>
    <a class="btn" href="/">Nazaj na domačo stran</a>
    <p class="en">Page not found. <a href="/index_en.html">Return to the homepage</a>.</p>
</body>

</html>
